<article class="native-article">
    <div class="native-article__marking native-marking">%advertiser%</div>
    <h1 class="native-article__headline">%headline%</h1>
    <figure class="native-article__asset">
        {#ifdef srcAttrs}<img sizes="%sizes%" %srcAttrs% />{/ifdef}
        {#ifdef video}%video%{/ifdef}
        <figcaption class="native-article__figcaption">%assetCaption%</figcaption>
    </figure>
    <div class="native-article__text">
        <div class="native-article__lead">%lead%</div>
        <div class="native-article__body">%body%</div>
    </div>
</article>
