<a class="native-teaser" href="%url%">
    <div class="native-teaser__marking">%advertiser%</div>
    <div class="native-teaser__asset">
        {#ifdef srcAttrs}<img sizes="%sizes%" %srcAttrs%>{/ifdef}
        {#ifdef video}%video%{/ifdef}
    </div>
    <div class="native-teaser__text">
        <div class="native-teaser__headline">%headline%</div>
        <div class="native-teaser__lead">%lead%</div>
    </div>
</a>
