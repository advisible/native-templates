<a class="native-teaser" href="%url%">
    <div class="native-teaser__rounded-container">
        <div class="native-teaser__marking">ADVERTISEMENT</div>
        <div class="native-teaser__asset">
            {#ifdef srcAttrs}<img sizes="%sizes%" %srcAttrs%>{/ifdef}
            {#ifdef video}%video%{/ifdef}
        </div>
    </div>
    <div class="native-teaser__headline">%headline%</div>
    <div class="native-teaser__lead">
        <span class="native-teaser__advertiser">%advertiser%</span>%lead%
    </div>
</a>
